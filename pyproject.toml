[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "yt-playlist-mp3"
version = "0.1.0"
description = "CLI-Wrapper um yt-dlp, der YouTube-Playlists als MP3-Dateien herunterlädt."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "Tim Heinemann" }]
keywords = ["youtube", "playlist", "mp3", "yt-dlp", "ffmpeg", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Utilities",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "ruff>=0.5",
]

[project.scripts]
yt-playlist-mp3 = "yt_playlist_mp3.cli:main"

[project.urls]
Homepage = "https://github.com/t1mdotcom/Youtube-Playlist-MP3-Download"
Issues = "https://github.com/t1mdotcom/Youtube-Playlist-MP3-Download/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/yt_playlist_mp3"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
